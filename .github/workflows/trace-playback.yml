name: Inspect player stream handler

on:
  push:
    paths:
      - ".github/workflows/trace-playback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print complete stream handler
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/source-00.b64 bundle/source-01a.b64 bundle/source-01b.b64 bundle/source-01c1.b64 bundle/source-01c2a.b64 bundle/source-01c2b.b64 bundle/source-02.b64 bundle/source-03.b64 bundle/source-04-*.b64 bundle/source-05-*.b64 bundle/source-06-*.b64 | base64 -d > /tmp/hub-source.tar.gz
          mkdir -p /tmp/hub-source
          tar -xzf /tmp/hub-source.tar.gz -C /tmp/hub-source
          echo "===== SERVER STREAM HANDLER ====="
          sed -n '405,495p' /tmp/hub-source/src/server.js
          echo "===== CLIENT STREAM HANDLER ====="
          grep -n -A50 -B8 "function streamAddon" /tmp/hub-source/src/addon/client.js
          echo "===== STREAM TESTS ====="
          grep -R -n -A30 -B8 "streamFromSearchTrack\\|fallbackTrack\\|checkAddon" /tmp/hub-source/tests --include='*.js' || true

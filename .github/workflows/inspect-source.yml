name: Inspect bundled source

on:
  push:
    paths:
      - ".github/workflows/inspect-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the deployed source and print database code
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/source-00.b64 bundle/source-01a.b64 bundle/source-01b.b64 bundle/source-01c1.b64 bundle/source-01c2a.b64 bundle/source-01c2b.b64 bundle/source-02.b64 bundle/source-03.b64 bundle/source-04-*.b64 bundle/source-05-*.b64 bundle/source-06-*.b64 | base64 -d > /tmp/hub-source.tar.gz
          mkdir -p /tmp/hub-source
          tar -xzf /tmp/hub-source.tar.gz -C /tmp/hub-source
          echo "===== SOURCE FILES ====="
          find /tmp/hub-source/src -maxdepth 3 -type f -print | sort
          echo "===== STORE MODULE ====="
          if [ -f /tmp/hub-source/src/store.js ]; then sed -n '1,360p' /tmp/hub-source/src/store.js; fi
          echo "===== DATABASE WRITE CALLS ====="
          grep -R -n -E "prepare\\(|\\.run\\(|INSERT INTO|UPDATE .* SET|save[A-Z].*(Addon|Source|Extension)" /tmp/hub-source/src --include='*.js' | head -n 220 || true

name: Clean rebuilt addon bundle

on:
  push:
    paths:
      - ".github/workflows/cleanup-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the fix and rebuild a source-only bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/source-00.b64 bundle/source-01a.b64 bundle/source-01b.b64 bundle/source-01c1.b64 bundle/source-01c2a.b64 bundle/source-01c2b.b64 bundle/source-02.b64 bundle/source-03.b64 bundle/source-04-*.b64 bundle/source-05-*.b64 bundle/source-06-*.b64 | base64 -d > /tmp/hub-source.tar.gz
          mkdir -p /tmp/hub-source
          tar -xzf /tmp/hub-source.tar.gz -C /tmp/hub-source
          cd /tmp/hub-source
          rm -rf /tmp/hub-sqlite-test
          DATA_DIR=/tmp/hub-sqlite-test DATA_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const { saveAddon, db } = await import('./src/store.js');
          const owner = 'sqlite-regression-test';
          const created = saveAddon(owner, {
            name: 'Lastwave Private', adapter: 'lastwave',
            config: { manifestUrl: 'https://example.test/manifest.json' },
            enabled: true, isTrial: false, priority: 0
          });
          let raw = db.prepare('SELECT enabled, is_trial FROM addons WHERE id=?').get(created.id);
          assert.deepEqual(raw, { enabled: 1, is_trial: 0 });
          const updated = saveAddon(owner, {
            id: created.id, name: 'Lastwave Private', adapter: 'lastwave',
            config: { manifestUrl: 'https://example.test/manifest.json' },
            enabled: false, isTrial: true, priority: 0
          });
          raw = db.prepare('SELECT enabled, is_trial FROM addons WHERE id=?').get(created.id);
          assert.deepEqual(raw, { enabled: 0, is_trial: 1 });
          assert.equal(updated.enabled, false);
          assert.equal(updated.isTrial, true);
          db.close();
          console.log('PASS: addon create/update SQLite regression test.');
          NODE
          cd "$GITHUB_WORKSPACE"
          find /tmp/hub-source -type d -name node_modules -prune -exec rm -rf {} +
          tar -czf /tmp/hub-source-clean.tar.gz -C /tmp/hub-source .
          base64 -w0 /tmp/hub-source-clean.tar.gz > /tmp/hub-source-clean.b64
          python3 - <<'PY'
          from pathlib import Path
          bundle = Path("bundle")
          payload = Path("/tmp/hub-source-clean.b64").read_text()
          layout = [
              ("source-00.b64", 15000), ("source-01a.b64", 5000),
              ("source-01b.b64", 5000), ("source-01c1.b64", 2500),
              ("source-01c2a.b64", 2000), ("source-01c2b.b64", 500),
              ("source-02.b64", 15000), ("source-03.b64", 15000),
          ]
          for old in bundle.glob("source-*.b64"):
              old.unlink()
          pos = 0
          for name, size in layout:
              (bundle / name).write_text(payload[pos:pos+size])
              pos += size
          remainder = payload[pos:]
          cuts = [len(remainder)//3, (2*len(remainder))//3]
          groups = [remainder[:cuts[0]], remainder[cuts[0]:cuts[1]], remainder[cuts[1]:]]
          for group, data in zip(("04", "05", "06"), groups):
              for index, start in enumerate(range(0, len(data), 10000)):
                  (bundle / f"source-{group}-{index:04d}.b64").write_text(data[start:start+10000])
          print(f"CLEAN BUNDLE: {len(payload)} base64 characters; {len(list(bundle.glob('source-*.b64')))} chunks; node_modules excluded.")
          PY
          rm .github/workflows/cleanup-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bundle .github/workflows/cleanup-bundle.yml
          git commit -m "Keep addon bundle source-only"
          git push

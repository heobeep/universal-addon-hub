services:
  - type: web
    name: universal-addon-hub
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      cat bundle/source-00.b64 bundle/source-01a.b64 bundle/source-01b.b64 bundle/source-01c1.b64 bundle/source-01c2a.b64 bundle/source-01c2b.b64 bundle/source-02.b64 bundle/source-03.b64 bundle/source-04-*.b64 bundle/source-05-*.b64 bundle/source-06-*.b64 | base64 -d > /tmp/hub-source.tar.gz &&
      tar -xzf /tmp/hub-source.tar.gz -C . &&
      npm install &&
      sed -i "s/import { saveMornyeExtension, getMornyeExtension, setMornyeExtensionEnabled, deleteMornyeExtension }/import { listMornyeExtensions, saveMornyeExtension, getMornyeExtension, setMornyeExtensionEnabled, deleteMornyeExtension }/" src/mornye/registry.js &&
      sed -i "s/export { getMornyeExtension, setMornyeExtensionEnabled };/export { getMornyeExtension, setMornyeExtensionEnabled, listMornyeExtensions };/" src/mornye/registry.js &&
      node -e "import('./src/mornye/registry.js').then(m => console.log('Mornye registry ready:', Object.keys(m).join(', ')))"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/universal-addon-hub-data
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_IDS
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_URL_SECRET
        sync: false
      - key: SOUNDLINK_APP_URL
        value: https://radha-50047163825.development.catalystappsail.in/
      - key: RENEWAL_CHECK_INTERVAL_MINUTES
        value: "10"
      - key: RENEWAL_REMIND_HOURS
        value: "72,24,6,1"
      - key: RENEWAL_BEFORE_HOURS
        value: "24"
